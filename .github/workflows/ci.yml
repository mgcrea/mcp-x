name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default for every job. `test` runs the dependency tree's lifecycle
# scripts, in the same workflow as a job holding id-token: write; it must not
# inherit a repository default that may be read/write on contents.
permissions:
  contents: read

jobs:
  test:
    name: Test on node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines.node says >=22, so the floor is tested, not just claimed.
        node: ["22", "lts/*"]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: TypeScript 🔍
        run: pnpm run typecheck
      - name: Test 🧪
        run: pnpm run test
      - name: Build 📦
        run: pnpm run build
      # Every client config in the wild spells this server `npx -y <package>`,
      # and npx picks the bin by name: it only forgives a mismatch while the
      # package ships exactly one. So the day a second bin is added, that
      # command starts failing with "could not determine executable to run" —
      # at the client, with stderr swallowed, long after CI was green. Mirrors
      # npm's own getBinFromManifest, so it fails here first instead.
      - name: npx can resolve a bin 🔒
        run: |
          node -e "
            const pkg = require('./package.json');
            const bin = pkg.bin ?? {};
            const unscoped = pkg.name.slice(pkg.name.indexOf('/') + 1);
            if (new Set(Object.values(bin)).size > 1 && !bin[unscoped]) {
              console.error('npx cannot pick a bin for ' + pkg.name + ': none of [' +
                Object.keys(bin).join(', ') + '] is named ' + unscoped + '.');
              console.error('Add a ' + unscoped + ' alias pointing at the server entry point.');
              process.exit(1);
            }
          "
      - name: Package is publishable 🔍
        run: |
          node -e '
            const pkg = require("./package.json");
            if (pkg.private) {
              console.error("package.json has \"private\": true — npm publish and the release job will both refuse it.");
              process.exit(1);
            }
            if (!pkg.publishConfig || pkg.publishConfig.access !== "public") {
              console.error("a scoped package needs publishConfig.access = \"public\".");
              process.exit(1);
            }
            console.log(`publishable: ${pkg.name}@${pkg.version}`);
          '

      # The tool list is the server's public contract, and it is easy to change
      # by accident. Three phases against the BUILT cli, because unit tests
      # cannot see a bundle that no longer starts or a `bin` pointing at nothing:
      #   1. no configuration at all — the server must still answer tools/list
      #      with exactly the free tools (a server that exits here shows in the
      #      client as "Connection closed" with stderr swallowed);
      #   2. credentialled but every gate off — reads present, writes and ads absent;
      #   3. gates on — the write tools appear, which is the positive check the
      #      second phase cannot make (it keeps passing after every write tool
      #      is renamed away).
      # HOME=/nonexistent so the runner's own config directory is never read.
      - name: MCP smoke test 🧪
        run: |
          list() {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | env -i PATH="$PATH" HOME=/nonexistent "$@" node dist/cli.js 2>/dev/null \
            | grep -o '"name":"x_[a-z_]*"' | sort -u | tr -d '"' | sed 's/name://'
          }
          list > /tmp/phase1.txt
          # x_login and x_logout are here even with nothing configured: a
          # supervisor's Sign in button calls x_login by name off its own
          # catalog, so the tool has to exist to answer with what to set
          # rather than with the MCP SDK's generic "Tool x_login not found".
          expected='x_build_search_query
          x_compose_post
          x_get_auth_status
          x_login
          x_logout
          x_validate_post'
          diff <(echo "$expected" | sed 's/^ *//') /tmp/phase1.txt \
            || { echo "phase 1: unconfigured server did not expose exactly the free tools"; exit 1; }

          list X_BEARER_TOKEN=ci-fake > /tmp/phase2.txt
          grep -qx 'x_get_post' /tmp/phase2.txt || { echo "phase 2: read tools missing"; exit 1; }
          ! grep -q 'x_create_post\|x_delete_post' /tmp/phase2.txt || { echo "phase 2: paid writes leaked"; exit 1; }
          ! grep -q 'x_ads_' /tmp/phase2.txt || { echo "phase 2: ads tools leaked"; exit 1; }

          list X_BEARER_TOKEN=ci-fake X_CLIENT_ID=ci X_ALLOW_WRITES=1 X_WRITE_BACKEND=api > /tmp/phase3.txt
          grep -qx 'x_create_post' /tmp/phase3.txt || { echo "phase 3: paid writes did not register"; exit 1; }
          grep -qx 'x_login' /tmp/phase3.txt || { echo "phase 3: login tool went missing with a client id configured"; exit 1; }

          # A contradiction between flags must degrade, never exit: this once
          # took the whole server down with the explanation swallowed.
          list X_ADS_ENABLED=1 > /tmp/phase4.txt
          diff /tmp/phase1.txt /tmp/phase4.txt \
            || { echo "phase 4: a misconfigured flag changed the tool list or killed the server"; exit 1; }

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # id-token: write is required for OIDC trusted publishing + provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Upgrade npm 🔧
        # OIDC trusted publishing needs a recent npm CLI
        run: npm install -g npm@latest
      # A version already on npm cannot be republished, so re-running this job — after
      # re-pushing a tag, or a manual re-run — would fail on a duplicate. Skip instead,
      # so the tag is the source of truth and pushing one is always safe.
      - name: Check npm for this version 🔍
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish 🚀
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Create release 🏷️
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true

  docker:
    name: Docker (build & push)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # id-token: write is required for cosign keyless signing
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Git metadata 🏷️
        id: git
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU 🧰
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx 🧰
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR 🔐
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata 🏷️
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short

      - name: Build & push 🚢
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.git.outputs.commit }}
            GIT_COMMIT_DATE=${{ steps.git.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup cosign 🔏
        uses: sigstore/cosign-installer@v3

      - name: Sign image 🔏
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
